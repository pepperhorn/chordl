name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      # Version comes from the root package.json "packageManager" field.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Build first: packages resolve each other's types from dist (chordl-core
      # imports @pepperhorn/chordl-voicings), so lint and test both fail on a
      # clean checkout until the workspace has been built once.
      - name: Build
        run: pnpm build

      # The chordl.app site build type-checks dev/ (the site entry), which
      # the package tsconfig excludes. Without this a missing name in
      # dev/App.tsx builds fine and blanks the live site (see #96).
      - name: Site build
        run: pnpm --filter @pepperhorn/chordl-react build:site

      - name: Lint
        run: pnpm lint

      - name: Lint tests
        run: pnpm lint:test

      - name: Test
        run: pnpm test:run

      - name: Packed board consumer
        run: node scripts/verify-board-package.mjs
